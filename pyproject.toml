[project]
name = "defer-tool"
version = "0.1.0"
description = "Clang-based defer source transformation"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.14,<1",
    "ty>=0.0.99,<0.1",
]
[tool.ruff]
extend-exclude = ["python/vendor"]

[tool.ty.src]
exclude = ["python/vendor"]
[tool.ty.environment]
extra-paths = ["python/vendor"]
